name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  linux-gate:
    name: Linux bash release gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Validate release readiness
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Run Linux bash smoke tests
        shell: bash
        run: bash tests/run-all.sh

      - name: Run release-tooling self-tests
        shell: pwsh
        run: ./scripts/release/test-validate-release-readiness.ps1

  windows-gate:
    name: Windows PowerShell release gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        shell: powershell
        run: |
          $v = "${env:GITHUB_REF_NAME}".Substring(1)
          "version=$v" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Output "Version: $v"

      - name: Validate release readiness
        shell: powershell
        run: .\scripts\release\validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Run Windows PowerShell bridge smoke
        shell: powershell
        run: .\tests\test-release-powershell.ps1

      - name: Run release-tooling self-tests
        shell: powershell
        run: .\scripts\release\test-validate-release-readiness.ps1

  macos-gate:
    name: macOS bash release gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install supported Bash and jq
        shell: bash
        run: brew install bash jq

      - name: Run macOS bash smoke and portability regression
        shell: bash
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash --version | head -n 1
          bash tests/run-all.sh
          bash tests/test-update-handoff-portability.sh

  release:
    name: Build + publish release
    needs:
      - linux-gate
      - windows-gate
      - macos-gate
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Extract version from tag
        id: ver
        run: |
          v="${GITHUB_REF_NAME#v}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Version: $v"

      - name: Validate release readiness
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}'

      - name: Build extension ZIP
        shell: bash
        run: bash scripts/release/build-extension-zip.sh --version '${{ steps.ver.outputs.version }}'

      - name: Run package smoke
        shell: bash
        run: bash tests/test-release-package.sh

      - name: Validate release package
        shell: pwsh
        run: ./scripts/release/validate-release-readiness.ps1 -Version '${{ steps.ver.outputs.version }}' -PackageZip 'dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip'

      - name: Verify tested runtime and write asset checksums
        shell: bash
        run: |
          python scripts/release/runtime-digest.py 'dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip' > dist/release-index.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          index=json.loads(Path('dist/release-index.json').read_text())
          verified=json.loads(Path('.specify/extensions/speckit-superpowers-bridge/verified-versions.json').read_text())
          assert index['runtime_sha256']==verified['candidate_runtime_sha256'], 'Runtime differs from real-model candidate evidence'
          assets=sorted(Path('dist').glob('*.zip'))
          Path('dist/SHA256SUMS').write_text(''.join(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n' for p in assets))
          PY

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          python3 - '${{ steps.ver.outputs.version }}' <<'PY'
          from pathlib import Path
          import re
          import sys

          version = sys.argv[1]
          body = Path("CHANGELOG.md").read_text(encoding="utf-8")
          pattern = rf"(?ms)^##\s*\[{re.escape(version)}\][^\n]*\n(.*?)(?=^##\s*\[|\Z)"
          match = re.search(pattern, body)
          if not match:
              print(f"::error::No '## [{version}]' section in CHANGELOG.md")
              raise SystemExit(1)
          notes = match.group(1).strip()
          Path("release-notes.md").write_text(notes + "\n", encoding="utf-8")
          print("Notes (first 300 chars):")
          print(notes[:300])
          PY

      - name: Create GitHub release with ZIP asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md
            gh release upload "$GITHUB_REF_NAME" \
              --clobber \
              "dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip" \
              "dist/speckit-superpowers-bridge.zip" \
              "dist/SHA256SUMS" \
              "dist/release-index.json"
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes-file release-notes.md \
              "dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip" \
              "dist/speckit-superpowers-bridge.zip" \
              "dist/SHA256SUMS" \
              "dist/release-index.json"
          fi

      - name: Summary
        shell: bash
        run: |
          sha="$(sha256sum "dist/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip" | awk '{print $1}')"
          url="https://github.com/${{ github.repository }}/releases/download/$GITHUB_REF_NAME/speckit-superpowers-bridge-v${{ steps.ver.outputs.version }}.zip"
          latest_url="https://github.com/${{ github.repository }}/releases/latest/download/speckit-superpowers-bridge.zip"
          {
            printf '## Release published\n\n'
            printf -- '- Tag: %s\n' "$GITHUB_REF_NAME"
            printf -- '- Asset URL: %s\n' "$url"
            printf -- '- Latest alias URL: %s\n' "$latest_url"
            printf -- '- SHA256: %s\n\n' "$sha"
            printf '### Next manual step (cross-repo)\n\n'
            printf 'Open a clean Extension Submission issue at github/spec-kit with the new version metadata. Body template lives at marketplace/extension-submission-body.md.\n'
          } >> "$GITHUB_STEP_SUMMARY"

  published-linux-install:
    name: Published Linux native install
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/ci/verify-published-release.py '${{ github.ref_name }}' '${{ github.repository }}'

  published-windows-install:
    name: Published Windows native install
    needs: release
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python scripts/ci/verify-published-release.py '${{ github.ref_name }}' '${{ github.repository }}'
