name: Candidate package gates
on:
  workflow_dispatch:
  push:
    branches: [main, 'fix/**']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: bash tests/run-all.sh
      - name: Release validator self-tests
        shell: pwsh
        run: ./scripts/release/test-validate-release-readiness.ps1
      - name: Build candidate and immutable index
        run: |
          bash scripts/release/build-extension-zip.sh --version 1.4.0
          python scripts/release/runtime-digest.py dist/speckit-superpowers-bridge-v1.4.0.zip > dist/candidate-index.json
      - run: python scripts/ci/verify-package-install.py --zip dist/speckit-superpowers-bridge-v1.4.0.zip --index dist/candidate-index.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bridge-candidate-package
          path: dist/
          retention-days: 14
  windows:
    needs: linux
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Native PowerShell 5.1 source smoke
        shell: powershell
        run: |
          ./tests/test-release-powershell.ps1
          ./scripts/release/test-validate-release-readiness.ps1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: bridge-candidate-package
          path: dist/
      - run: python scripts/ci/verify-package-install.py --zip dist/speckit-superpowers-bridge-v1.4.0.zip --index dist/candidate-index.json
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: brew install bash jq
      - name: Native macOS shell gates
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          bash tests/run-all.sh
          bash tests/test-update-handoff-portability.sh
